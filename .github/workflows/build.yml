# Tests and builds Ponte on every change. Pushing a tag like v1.2.0 also
# publishes a GitHub Release with the executables attached. The release can
# also be started from the Actions tab ("Run workflow") with a version: the
# tag is then created on the commit being built.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.2"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${RELEASE}" ]; then export VERSION="${RELEASE#v}"; fi
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ponte
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "version must look like v1.2.3" >&2; exit 1 ;; esac
          # Started twice for the same version (from the Actions tab and by
          # pushing the tag): the first run published it, nothing to do.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Ponte ${TAG#v}" \
            --generate-notes
